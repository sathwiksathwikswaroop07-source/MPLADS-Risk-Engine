# One free web service: FastAPI serves the API under /api and the built
# React app at every other path. Committed so the settings are reviewable
# rather than living only in a dashboard nobody else can see.
services:
  - type: web
    name: kavach
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # --host 0.0.0.0 is mandatory: bound to localhost the container is
    # unreachable, the health check fails and the service restarts in a
    # loop. $PORT is assigned by Render and must not be hardcoded.
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        # Generated once by Render and kept; never committed.
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11.9"
